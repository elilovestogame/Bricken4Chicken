name: Wolves FT alert

on:
  schedule:
    # Three daily launches (UTC) cover afternoon, evening and late tip-offs.
    # The script exits immediately if there's no game or tip-off is too far off.
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification and exit"
        type: boolean
        default: false

# Never run two copies at once, which would send duplicate alerts
concurrency:
  group: wolves-ft-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python wolves_ft_alert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
